<!DOCTYPE html>

    <title>Virtual T-Shirt Try-On</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

        function startOverlay() {
            fetch('/start_overlay');

            fetch('/stop_overlay');
        }

        </header>

        </main>
    </div>
</body>
</html>
